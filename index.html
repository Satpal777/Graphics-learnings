<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: black;
        margin: 0;
    }
    canvas {
        width: 100%;
        height: 100%;
        display: block;
    }
    #gpu-debug-overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        color: #e8e8e8;
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        pointer-events: none;
        z-index: 1000;
        min-width: 220px;
    }
    #gpu-debug-overlay .status {
        color: #4ade80;
        font-weight: 600;
        margin-bottom: 6px;
    }
    #gpu-debug-overlay .label {
        color: #9ca3af;
    }
    #gpu-debug-overlay .value {
        color: #f3f4f6;
    }
</style>
<body>
    <canvas id="canvas"></canvas>
    <div id="gpu-debug-overlay" aria-live="polite"></div>
</body>
<script type="module" src="./01/script.js"></script>
</html>
